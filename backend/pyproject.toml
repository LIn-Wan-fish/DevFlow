[project]
name = "devflow-backend"
version = "0.1.0"
description = "DevFlow AI - 多智能体研发协作助手(端到端最小闭环 Demo)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "langchain>=0.3.13",
  "langchain-core>=0.3.28",
  "langchain-openai>=0.2.14",
  "langgraph>=0.2.60",
  "pymilvus>=2.5.0",
  "httpx>=0.28",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]