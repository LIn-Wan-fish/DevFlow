# 这个流水线**不需要任何 Secret**。
#
# 后端测试用 SQLite 内存库 + 进程内向量库,前端测试是纯组件测试,
# 两边都刻意不联网、不打真实模型 —— 所以 CI 里放 GITHUB_TOKEN / OPENAI_API_KEY
# 既没必要,也不应该。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单测(全 Mock,不联网)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: mock
      EMBED_MODE: mock
      DATA_SOURCE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --group dev
      - name: 跑单测
        run: uv run pytest -q

  frontend:
    name: 前端单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        # 仓库里没有 package-lock.json,所以用 install 而不是 ci
        run: npm install
      - name: 跑单测
        run: npm test