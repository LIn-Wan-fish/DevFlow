# 生产形态的 override。用法:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale backend=3
#
# 和开发形态的差别:
#   - 前端跑 next build + next start,而不是 next dev(后者慢一个数量级,
#     且按需编译、内存持续增长,不能用来对外服务)
#   - 后端去掉 --reload,并用多个 worker
#   - 后端**不再映射宿主机端口**,改由 gateway 统一收请求 ——
#     否则 --scale 会因为端口冲突直接失败
#   - 都加上 restart: unless-stopped

services:
  gateway:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    # 去掉 --reload:它会监视文件变化并重启 worker,生产环境既没必要也危险
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2"]
    # 关键:不发布宿主机端口。多个副本共用 gateway 的 8000。
    # 必须用 !reset —— 写 `ports: []` 是**无效**的:空列表在合并语义里
    # 被当成"不修改",基础文件里的 8000:8000 会保留下来,
    # 于是 --scale 到第 3 个副本时就撞端口。
    ports: !reset []
    expose:
      - "8000"
    environment:
      # 跨进程缓存与调度锁 —— 多副本下必需
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    # next build 在启动时跑一次。NEXT_PUBLIC_* 是**构建期**注入的,
    # 所以 docker-compose.yml 里那个 NEXT_PUBLIC_API_BASE 会被打进产物。
    command: ["npm", "run", "prod"]
    restart: unless-stopped

  redis:
    restart: unless-stopped