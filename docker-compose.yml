# DevFlow AI Demo —— 单机七服务(postgres/etcd/minio/milvus/backend/frontend/ragas-eval)。
# 镜像全部写带源前缀的全名:本机 registry-1.docker.io 直连不可达,短名会拉不动。
name: devflow

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 3s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    # milvus 镜像内不一定有 curl,不用 healthcheck 卡住 backend;
    # 改为 backend 启动时自己重试连 Milvus(见 app/main.py lifespan)。
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://devflow:devflow@postgres:5432/devflow
      MILVUS_URI: http://milvus:19530
      SNAPSHOT_DIR: /app/data/snapshot
      # RAGAS 评测在独立容器里跑(依赖与主程序冲突,见 services/ragas_eval/app.py)
      RAGAS_EVAL_URL: http://ragas-eval:8100
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # RAGAS 评测器。**单独一个容器是必须的,不是随意拆分**:
  # ragas 与主程序的 langchain 1.x 栈无法共存(新版导入即崩、老版强降 langchain 把主程序打挂),
  # 详细原因写在 services/ragas_eval/app.py 顶部。它的依赖树被限制在这个容器里。
  ragas-eval:
    build:
      context: ./services/ragas_eval
      args:
        # 国内环境可设 PIP_INDEX_URL 指向镜像源(例如 https://mirrors.aliyun.com/pypi/simple/)
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - .env
    environment:
      EMBED_MODE: ${EMBED_MODE:-mock}
    expose:
      - "8100"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: ["npm", "run", "dev"]

volumes:
  pgdata:
  milvusdata: