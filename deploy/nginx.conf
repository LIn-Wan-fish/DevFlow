# 反向代理。**多副本部署必需的一环**:
# 每个 backend 副本都要监听容器内的 8000,不可能都去占用宿主机同一个端口,
# 所以由它在前面收请求、轮询分发。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker 内嵌 DNS。用变量 + resolver 而不是写死 upstream:
    # 写死 upstream 时 nginx 只在启动那一刻解析一次,`--scale` 之后新起的副本
    # 不会被加进来。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;

        location / {
            set $backend http://backend:8000;
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # ---- SSE 的关键三行 ----
            # 不关缓冲的话,nginx 会把事件攒在自己的缓冲区里,等攒够一块才吐给浏览器 ——
            # 表现就是"流式对话卡住不动,过很久一次性全出来"。
            proxy_buffering off;
            proxy_cache off;
            # 长连接:一次对话可能跑几分钟,默认 60s 会被中途掐断
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 空 Connection 头,交给上游决定是否 keep-alive
            proxy_set_header Connection "";
        }
    }
}